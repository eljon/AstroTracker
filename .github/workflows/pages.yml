name: Deploy to GitHub Pages

on:
  # Deploy whenever the site changes on the default branch.
  push:
    branches:
      - main
      - master
      - claude/adams-astronaut-tracker-23erpe
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Grant the token the permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns GitHub Pages on for the repo automatically,
        # so there's no manual Settings step required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (index.html lives at the root).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
